<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Event Registration Portal</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI',sans-serif;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;

    background:url('https://images.unsplash.com/photo-1492684223066-81342ee5ff30?auto=format&fit=crop&w=1600&q=80');
    background-size:cover;
    background-position:center;
}

.container{
    width:90%;
    max-width:1100px;
    height:650px;

    display:flex;

    border-radius:20px;
    overflow:hidden;

    box-shadow:0 15px 40px rgba(0,0,0,0.4);
}

.left-panel{
    flex:1;

    background:url('https://images.unsplash.com/photo-1511578314322-379afb476865?auto=format&fit=crop&w=1200&q=80');
    background-size:cover;
    background-position:center;

    position:relative;
}

.overlay{
    position:absolute;
    top:0;
    left:0;
    width:100%;
    height:100%;

    background:rgba(0,0,0,0.55);

    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;

    color:white;
    text-align:center;
    padding:40px;
}

.overlay h1{
    font-size:42px;
    margin-bottom:15px;
}

.overlay p{
    font-size:18px;
    line-height:1.6;
}

.right-panel{
    flex:1;

    background:rgba(255,255,255,0.95);

    padding:50px;

    display:flex;
    flex-direction:column;
    justify-content:center;
}

.right-panel h2{
    text-align:center;
    margin-bottom:20px;
    color:#333;
}

.btn-group{
    display:flex;
    margin-bottom:20px;
}

.btn-group button{
    flex:1;
    padding:12px;

    border:none;
    cursor:pointer;

    background:#ddd;
    font-size:16px;
    font-weight:bold;
}

.btn-group button.active{
    background:#667eea;
    color:white;
}

form{
    display:flex;
    flex-direction:column;
}

input{
    padding:12px;
    margin:10px 0;

    border:1px solid #ccc;
    border-radius:8px;

    font-size:15px;
}

.submit-btn{
    margin-top:10px;
    padding:12px;

    border:none;
    border-radius:8px;

    background:#667eea;
    color:white;

    font-size:16px;
    cursor:pointer;
}

.submit-btn:hover{
    background:#5563d6;
}

#signupForm{
    display:none;
}

@media(max-width:768px){

.container{
    flex-direction:column;
    height:auto;
}

.left-panel{
    height:250px;
}

.right-panel{
    padding:30px;
}

.overlay h1{
    font-size:30px;
}

}
</style>

</head>
<body>

<div class="container">

    <div class="left-panel">

        <div class="overlay">

            <h1>Event Registration Portal</h1>

            <p>
                Join exciting Technical, Cultural,
                Sports and Workshop Events.
                Register easily and manage all
                your events in one place.
            </p>

        </div>

    </div>

    <div class="right-panel">

        <h2>Welcome</h2>

        <div class="btn-group">

            <button id="loginBtn" class="active">
                Login
            </button>

            <button id="signupBtn">
                Sign Up
            </button>

        </div>

        <!-- LOGIN FORM -->

        <form id="loginForm">

            <input
                type="email"
                placeholder="Email Address"
                required>

            <input
                type="password"
                placeholder="Password"
                required>

            <button
                type="submit"
                class="submit-btn">
                Login
            </button>

        </form>

        <!-- SIGNUP FORM -->

        <form id="signupForm">

            <input
                type="text"
                placeholder="Full Name"
                required>

            <input
                type="email"
                placeholder="Email Address"
                required>

            <input
                type="password"
                placeholder="Password"
                required>

            <input
                type="password"
                placeholder="Confirm Password"
                required>

            <button
                type="submit"
                class="submit-btn">
                Create Account
            </button>

        </form>

    </div>

</div>

<script>

const loginBtn =
document.getElementById("loginBtn");

const signupBtn =
document.getElementById("signupBtn");

const loginForm =
document.getElementById("loginForm");

const signupForm =
document.getElementById("signupForm");

loginBtn.addEventListener("click",()=>{

    loginForm.style.display="flex";
    signupForm.style.display="none";

    loginBtn.classList.add("active");
    signupBtn.classList.remove("active");

});

signupBtn.addEventListener("click",()=>{

    loginForm.style.display="none";
    signupForm.style.display="flex";

    signupBtn.classList.add("active");
    loginBtn.classList.remove("active");

});

loginForm.addEventListener("submit",function(e){

    e.preventDefault();

    alert("Login Successful!");

});

signupForm.addEventListener("submit",function(e){

    e.preventDefault();

    alert("Account Created Successfully!");

});

</script>

</body>
</html>
